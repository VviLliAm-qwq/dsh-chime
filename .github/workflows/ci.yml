name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pure ESM with no dependencies and no build step: lib/ is the source and
      # assets/ carries the samples, so nothing has to be installed first.
      - name: Syntax-check every module
        run: |
          for f in lib/*.js; do
            node --check "$f"
          done

      - name: Reject a UTF-8 BOM (a BOM in JSON/YAML is a hard host failure)
        run: |
          if grep -rlP '^\xef\xbb\xbf' --include='*.json' --include='*.yml' --include='*.md' --include='*.js' .; then
            echo "::error::the files above start with a UTF-8 BOM"
            exit 1
          fi
          echo "no BOM found"

      # CC0 needs no attribution, but the credits file records where every
      # sample came from and must travel with the package.
      - name: The sound assets ship
        run: |
          test -f assets/sounds/CREDITS.md
          ls assets/sounds/*.wav >/dev/null
          echo "$(ls assets/sounds/*.wav | wc -l) samples + CREDITS.md"

      - name: Verify the published tarball layout
        run: npm pack --dry-run
